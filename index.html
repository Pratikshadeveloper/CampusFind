<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CampusFind</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f5f7fb;padding:15px}.header{background:#6c5ce7;color:white;padding:20px;border-radius:15px;text-align:center;margin-bottom:20px}.form{background:white;padding:20px;border-radius:15px;margin-bottom:20px}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{background:#6c5ce7;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer}.card{background:white;padding:15px;border-radius:12px;margin-bottom:12px;border-left:5px solid #6c5ce7}.badge{padding:4px 10px;border-radius:20px;color:white;font-size:12px}.lost{background:#ff7675}.found{background:#00b894}</style></head><body><div class="header"><h1>🎓 CampusFind</h1><p>Database Connected ✅</p></div><div class="form"><select id="type"><option value="lost">Lost</option><option value="found">Found</option></select><input id="title" placeholder="Title ex: Blue Bag"><textarea id="description" placeholder="Description"></textarea><input id="location" placeholder="Location"><input id="contact" placeholder="Contact"><button onclick="addItem()">Add to Database</button></div><div id="items">Loading...</div><script>
const SUPABASE_URL = 'https://quhqeruzsijmtwpevxb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DP--GTcfvtU-NvS67AQ-pQ_jGn9S9qj';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function loadItems(){const {data} = await client.from('items').select('*').order('created_at',{ascending:false});document.getElementById('items').innerHTML=data.map(i=>`<div class="card"><span class="badge ${i.type}">${i.type}</span><h3>${i.title}</h3><p>${i.description||''}</p><p>📍 ${i.location||''} | 📞 ${i.contact||''}</p></div>`).join('')||'No items';}
async function addItem(){const item={title:title.value,description:description.value,location:location.value,contact:contact.value,type:type.value};if(!item.title)return alert('Title tak');const {error}=await client.from('items').insert([item]);if(error)alert(error.message);else{alert('Saved!');loadItems();title.value='';}}
loadItems();
</script></body></html>
